# The production box: prod and sandbox side by side, sharing only the VPN exit and the TLS proxy. Each environment
# has its own images, env file (gateway, database, bucket, secrets) and is switched on once it has been deployed.
# Gateway calls (gatekeeper, UAPI) leave only through the VPN proxy; RDS and S3 are reached directly.
x-logging: &logging
  driver: json-file
  options: { max-size: 10m, max-file: '5' }

x-app: &app
  environment: { EGRESS_PROXY_URL: 'http://vpn:8888' }
  depends_on: [vpn]
  restart: unless-stopped
  logging: *logging

x-worker: &worker
  <<: *app
  stop_grace_period: 30s

services:
  vpn:
    image: qmcgaw/gluetun:v3.41.3
    cap_add: [NET_ADMIN]
    devices: [/dev/net/tun:/dev/net/tun]
    environment:
      VPN_SERVICE_PROVIDER: protonvpn
      VPN_TYPE: openvpn
      OPENVPN_USER: ${OPENVPN_USER}
      OPENVPN_PASSWORD: ${OPENVPN_PASSWORD}
      SERVER_COUNTRIES: India,Singapore
      HTTPPROXY: 'on'
      HTTPPROXY_LISTENING_ADDRESS: ':8888'
      # gluetun drops inbound traffic by default; the app containers reach the proxy on this port.
      FIREWALL_INPUT_PORTS: '8888'
      HEALTH_TARGET_ADDRESSES: 1.1.1.1:443
      HEALTH_VPN_DURATION_INITIAL: 30s
    restart: unless-stopped
    logging: *logging

  prod-web:
    <<: *app
    profiles: [prod]
    image: ${REGISTRY}/amusemonk-web:${PROD_REVISION:-none}
    env_file: [{ path: prod.env, required: false }]

  prod-worker:
    <<: *worker
    profiles: [prod]
    image: ${REGISTRY}/amusemonk-worker:${PROD_REVISION:-none}
    env_file: [{ path: prod.env, required: false }]

  sandbox-web:
    <<: *app
    profiles: [sandbox]
    image: ${REGISTRY}/amusemonk-web:${SANDBOX_REVISION:-none}
    env_file: [{ path: sandbox.env, required: false }]

  sandbox-worker:
    <<: *worker
    profiles: [sandbox]
    image: ${REGISTRY}/amusemonk-worker:${SANDBOX_REVISION:-none}
    env_file: [{ path: sandbox.env, required: false }]

  caddy:
    image: caddy:2.8-alpine
    ports: ['80:80', '443:443', '443:443/udp']
    volumes:
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    logging: *logging

volumes:
  caddy_data:
  caddy_config:
